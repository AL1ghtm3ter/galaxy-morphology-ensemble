[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "galaxy-morphology-ensemble"
version = "0.2.0"
description = "Galaxy Zoo morphology regression with a PyTorch Transformer/CNN ensemble"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "AL1ghtm3ter"}]
dependencies = ["numpy>=1.24", "Pillow>=10"]

[project.optional-dependencies]
train = ["torch>=2.4", "torchvision>=0.19", "pandas>=2.0", "scikit-learn>=1.3"]
viz = ["matplotlib>=3.8"]
notebook = ["jupyterlab>=4", "nbformat>=5.10", "scipy>=1.11", "tqdm>=4.66", "ipykernel>=6"]

[project.scripts]
galaxy-morphology = "galaxy_morphology.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

